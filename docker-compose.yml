services:
  mysql:
    container_name: crm_mysql
    hostname: mysql-server
    image: mysql:8.4.2
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crm_app}
      MYSQL_USER: ${MYSQL_USER:-crm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your local .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your local .env file}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init-files:/docker-entrypoint-initdb.d:ro
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  crm_backend:
    container_name: crm_backend
    hostname: crm-backend-server
    image: python:3.11-slim
    working_dir: /root
    entrypoint: ['/entrypoint_dev.sh']
    environment:
      MYSQL_HOST: mysql-server
      MYSQL_DATABASE: ${MYSQL_DATABASE:-crm_app}
      MYSQL_USER: ${MYSQL_USER:-crm_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in your local .env file}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./requirements.txt:/root/requirements.txt:ro
      - ./backend_api.py:/root/backend_api.py:ro
      - ./entrypoint_dev.sh:/entrypoint_dev.sh:ro
    ports:
      - '127.0.0.1:5000:5000'
    restart: unless-stopped

  web_server:
    container_name: web_server
    hostname: web-server
    image: python:3.11-slim
    working_dir: /root
    entrypoint: ['/entrypoint_web_dev.sh']
    environment:
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      APP_CONFIG_DIR: /root/config
    depends_on:
      - crm_backend
    volumes:
      - ./requirements.txt:/root/requirements.txt:ro
      - ./entrypoint_web_dev.sh:/entrypoint_web_dev.sh:ro
      - ./web_server.py:/root/web_server.py:ro
      - ./index.html:/root/templates/index.html:ro
      - ./form.html:/root/templates/form.html:ro
      - ./welcome.html:/root/templates/welcome.html:ro
      - ./formlist.html:/root/templates/formlist.html:ro
      - ./scripts/:/root/templates/scripts/:ro
      - ./styles/:/root/templates/styles/:ro
      - ./config/:/root/config:ro
    ports:
      - '127.0.0.1:8080:80'
    restart: unless-stopped

volumes:
  mysql_data:
